[workspace]
members = [
  "types",
  "ui_helper",
  "logging",
  "itemeditor",
  "npceditor",
  "shopeditor",
]
resolver = "2"

[workspace.dependencies]
arr_macro = "0.2.1"
backtrace = "0.3.73"
bytey = "0.4.0"
chrono = {version = "0.4.38", features = ["serde"]}
educe = "0.6.0"
itertools = "0.14.0"
log = "0.4.21"
num-traits = "0.2.19"
num_enum = "0.7.2"
rand = "0.10.1"
serde = {version = "1.0.203", features = ["derive"]}
serde-big-array = "0.5.1"
serde_json = "1.0.117"
speedy = "0.8.7"
strum_macros = "0.28.0"

[workspace.dependencies.ascending_logger]
path = "./logging"

[workspace.dependencies.ascending_ui]
path = "./ui_helper"

[workspace.dependencies.ascending_types]
path = "./types"

[workspace.dependencies.iced_aw]
#git = "https://github.com/iced-rs/iced_aw.git"
version = "0.14.1"

[workspace.dependencies.iced]
features = ["canvas", "tokio", "image", "debug", "wgpu", "advanced"]
version = "0.14.0"
