[workspace]
members = [
  "database",
  "logging",
  "itemeditor",
  "npceditor",
  "shopeditor",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
backtrace = "0.3.73"
educe = "0.8.1"
gpui-kit = { version = "0.8.1", features = ["gpui-fast"] }
log = "0.4.21"
serde = {version = "1.0.203", features = ["derive"]}
serde-big-array = "0.5.1"
serde_json = "1.0.117"
speedy = "0.8.7"
tokio = {version = "1.52.3", features = ["full", "tracing"]}

[workspace.dependencies.database]
path = "./database"

[workspace.dependencies.ascending_logger]
path = "./logging"
